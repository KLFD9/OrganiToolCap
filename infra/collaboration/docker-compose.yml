services:
  turn:
    image: coturn/coturn:4.11.0-r0
    restart: unless-stopped
    entrypoint:
      - /bin/sh
      - -ec
    command:
      - |
        exec turnserver \
          -n \
          --log-file=stdout \
          --listening-port=3478 \
          --min-port=49160 \
          --max-port=49200 \
          --realm="$${TURN_REALM}" \
          --external-ip="$${TURN_EXTERNAL_IP}" \
          --use-auth-secret \
          --static-auth-secret="$${TURN_SHARED_SECRET}" \
          --fingerprint \
          --stale-nonce \
          --no-multicast-peers \
          --no-loopback-peers \
          --no-cli
    environment:
      TURN_REALM: "${TURN_REALM:?TURN_REALM est requis}"
      TURN_EXTERNAL_IP: "${TURN_EXTERNAL_IP:?TURN_EXTERNAL_IP est requis}"
      TURN_SHARED_SECRET: "${TURN_SHARED_SECRET:?TURN_SHARED_SECRET est requis}"
    ports:
      - "3478:3478"
      - "3478:3478/udp"
      - "49160-49200:49160-49200/udp"
